<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F4F2ED"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Zen Calendar"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon.svg"><title>Zen Calendar</title><style>:root{--p:#F4F2ED;--s:#FBFAF7;--i:#20262A;--m:#7A7E7E;--b:#344958;--l:#DDDCD6}*{box-sizing:border-box}body{margin:0;background:#e7e5e0;color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.app{width:min(430px,100vw);min-height:100dvh;margin:auto;background:var(--p);padding:calc(14px + env(safe-area-inset-top)) 24px 100px}.version{font-size:11px;color:var(--m)}#screen{min-height:75dvh;touch-action:pan-y}.date{font-family:Georgia,serif;font-size:35px;margin:30px 0 5px}.section{margin-top:28px}.title{font-size:13px;letter-spacing:.12em;border-bottom:1px solid var(--l);padding-bottom:8px}.card{background:var(--s);border:1px solid var(--l);border-radius:22px;padding:17px;margin:9px 0}.event{display:grid;grid-template-columns:60px 1fr;gap:8px}.time{font:20px Georgia,serif}.small{font-size:12px;color:var(--m)}button{font:inherit}.primary{width:100%;border:0;border-radius:999px;padding:15px;background:var(--b);color:white}.quick{display:grid;grid-template-columns:1fr 58px;gap:10px;margin-top:22px}.mic{border:1px solid var(--l);border-radius:50%;background:var(--s);font-size:20px}nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(390px,calc(100vw - 32px));height:70px;border:1px solid var(--l);border-radius:28px;background:#fbfaf7ee;display:flex;justify-content:space-around;align-items:center}nav button{border:0;background:transparent;color:var(--m)}nav .on{color:var(--b);font-weight:700}.sheet{position:fixed;inset:0;background:#1115;display:flex;align-items:flex-end;justify-content:center}.sheet>div{width:min(430px,100%);background:var(--p);padding:25px;border-radius:28px 28px 0 0}.hidden{display:none}textarea{width:100%;min-height:130px;padding:14px;border:1px solid var(--l);border-radius:16px;background:var(--s)}.hint{text-align:center;font-size:11px;color:var(--m);margin-top:18px}.task{display:flex;justify-content:space-between;align-items:center}.task button{border:0;background:transparent}</style></head><body><div class="app"><div class="version">Zen Calendar <b id="ver"></b></div><main id="screen"></main></div><nav id="tabs"><button data-t="today" class="on">◉ 今日</button><button data-t="calendar">□ 行事曆</button><button data-t="review">☾ 整理</button><button data-t="settings">⌁ 設定</button></nav><div id="sheet" class="sheet hidden"></div><script src="app.js"></script></body></html>
